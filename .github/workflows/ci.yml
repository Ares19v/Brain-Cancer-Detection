name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1 — Frontend: lint + build
  # ─────────────────────────────────────────────────────────────────────────
  lint-frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build (Vite)
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2 — Backend: syntax + import check (no model weights needed)
  # ─────────────────────────────────────────────────────────────────────────
  lint-backend:
    name: Backend — Syntax & Import Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile main.py

      - name: Import check (CI mode — skips model load)
        env:
          CI: "true"
        run: |
          python -c "
          import os, sys
          os.environ['CI'] = 'true'
          sys.path.insert(0, '.')
          import main
          print('All imports OK. /health and /predict routes registered.')
          print('Routes:', [r.path for r in main.app.routes])
          "
